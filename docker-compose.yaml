name: altioria

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
  
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  
    ports:
      - "9000:9000"
      - "9001:9001"
  
    volumes:
      - minio_data:/data
  
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  
  minio-init:
    image: quay.io/minio/mc:latest
    restart: "no"
  
    depends_on:
      minio:
        condition: service_healthy
  
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
  
    volumes:
      - ./infra/minio/categories:/initial-images/categories:ro
  
    entrypoint:
      - /bin/sh
      - -c
  
    command:
      - |
        set -eu
  
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "Waiting for MinIO..."
          sleep 2
        done
  
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set download "local/$$MINIO_BUCKET"
  
        for file in /initial-images/categories/*.webp; do
          [ -f "$$file" ] || continue
  
          filename=$$(basename "$$file")
          target="local/$$MINIO_BUCKET/categories/default/$$filename"
  
          if mc stat "$$target" >/dev/null 2>&1; then
            echo "Object already exists: $$target"
          else
            mc cp "$$file" "$$target"
            echo "Uploaded: $$target"
          fi
        done
  
        echo "MinIO initialization completed"

  backend-migrate:
    build:
      context: ./altioria-backend
      dockerfile: Dockerfile
      target: build
    restart: 'no'
    env_file:
      - ./altioria-backend/.env.docker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ['npx', 'prisma', 'migrate', 'deploy']

  backend-seed:
    build:
      context: ./altioria-backend
      dockerfile: Dockerfile
      target: build
    restart: 'no'
    env_file:
      - ./altioria-backend/.env.docker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    command: ['npx', 'prisma', 'db', 'seed']

  backend:
    build:
      context: ./altioria-backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    init: true
    env_file:
      - ./altioria-backend/.env.docker
    environment:
      NODE_ENV: development
      PORT: 3000

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public

      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_REGION: us-east-1
      S3_BUCKET: ${MINIO_BUCKET}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: 'true'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      backend-seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data: